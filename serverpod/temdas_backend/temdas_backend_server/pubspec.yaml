name: temdas_backend_server
description: Starting point for a Serverpod server.
# version: 1.0.0
# homepage: https://www.example.com

environment:
  sdk: '^3.8.0'

resolution: workspace

dependencies:
  http: ^1.6.0
  jose: ^0.3.5+2
  serverpod: 3.4.11

dev_dependencies:
  lints: '>=3.0.0 <7.0.0'
  serverpod_test: 3.4.11
  test: ^1.25.5

serverpod:
  scripts:
    # Starts the server and applies migrations.
    start: dart bin/main.dart --apply-migrations