class: Sprint
table: sprints
fields:
  usuarioId: int, relation(parent=usuarios)
  nome: String
  nomeNormalizado: String?, scope=serverOnly
  dataInicio: DateTime
  dataFim: DateTime
  tempoPrevistoMinutos: int?
  status: SprintStatus
indexes:
  sprints_nome_normalizado_idx:
    fields: usuarioId, nomeNormalizado
    unique: true
