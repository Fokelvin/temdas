class: Demanda
table: demandas
fields:
  demandaPaiId: int?, relation(parent=demandas, onDelete=Cascade)
  titulo: String
  descricao: String?
  status: DemandaStatus
  motivoCancelamento: String?
  prioridade: Prioridade
  sprint: String?
  tempoEstimadoMinutos: int
  tempoExecutadoMinutos: int
  observacoes: String?
  criadoEm: DateTime
  atualizadoEm: DateTime
  concluidoEm: DateTime?
indexes:
  demandas_demanda_pai_id_idx:
    fields: demandaPaiId
