class: Demanda
table: demandas
fields:
  # Nullable apenas durante a fase de atribuição de owner aos dados existentes.
  usuarioId: int?, relation(parent=usuarios)
  demandaPaiId: int?, relation(parent=demandas, onDelete=Cascade)
  ordem: int?
  titulo: String
  descricao: String?
  status: DemandaStatus
  motivoCancelamento: String?
  prioridade: Prioridade
  tempoEstimadoMinutos: int
  tempoExecutadoMinutos: int
  observacoes: String?
  criadoEm: DateTime
  atualizadoEm: DateTime
  concluidoEm: DateTime?
indexes:
  demandas_demanda_pai_id_idx:
    fields: demandaPaiId
